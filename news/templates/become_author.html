{% extends 'default.html' %}
{% load i18n %}

{% block content %}
<div class="container mt-4">
  <div class="card">
    <div class="card-header">
      <h3 class="card-title">{% trans "Become an author" %}</h3>
    </div>

    <div class="card-body">
      <form method="post">
        {% csrf_token %}

        <div class="d-grid gap-2">
          <button type="submit" class="btn btn-success btn-lg">
            {% trans "Become an author now" %}
          </button>
        </div>
      </form>
    </div>

    <div class="card-footer text-muted">
      {% trans "By becoming an author you agree to our terms" %}
    </div>
  </div>
</div>
{% endblock %}
